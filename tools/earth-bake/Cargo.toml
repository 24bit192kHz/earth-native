[package]
name = "earth-bake"
version = "0.1.0"
edition = "2021"
description = "Offline baker: NASA Blue Marble / Black Marble / GEBCO / cloud sources to earth-native GPU textures"
license = "MIT"
publish = false

[dependencies]
block_compression = { version = "0.10", default-features = false, features = ["bc7", "wgpu"] }
intel_tex_2 = "0.5"
memmap2 = "0.9"
png = "0.18"
pollster = "0.4"
rayon = "1"
serde_json = "1"
tiff = "0.11"
wgpu = "30"

[profile.release]
opt-level = 3
debug = false
