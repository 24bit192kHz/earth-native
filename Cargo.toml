[package]
name = "earth-native"
version = "1.2.0"
edition = "2021"
rust-version = "1.80"
build = "build.rs"
description = "Physically based live Earth and planets desktop background for Wayland and Xorg (Vulkan)"
license = "MIT"
repository = "https://github.com/24bit192kHz/earth-native"
readme = "README.md"
keywords = ["wallpaper", "vulkan", "wayland", "x11", "astronomy"]
categories = ["graphics", "science"]

[[bin]]
name = "earthvt-pack"
path = "src/bin/earthvt_pack.rs"

[dependencies]
astronomy-engine-bindings = "=2.1.19"
ash = { version = "0.38", default-features = false, features = ["loaded", "std"] }
calloop = "0.13"
calloop-wayland-source = "0.3"
jpeg-encoder = "0.6"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# Xorg frontend: XCB connection (for VK_KHR_xcb_surface), RandR monitors,
# and the SHAPE input region that makes the desktop window click-through.
x11rb = { version = "0.13", features = ["allow-unsafe-code", "dl-libxcb", "randr", "shape"] }

[build-dependencies]
cc = "1"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"

# Host-only units (build.rs, cc, serde_derive/syn/quote and other proc-macros)
# never ship in the binary; compiling them unoptimized shortens clean release
# builds with zero effect on shipped codegen.
[profile.release.build-override]
opt-level = 0
